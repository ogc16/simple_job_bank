<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and filter open job listings.">
    <link rel="canonical" href="https://ogc16.github.io/simple_job_bank/pages/jobs.html">
    <meta name="theme-color" content="#8a2be2">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jobs Board | Job Portal">
    <meta property="og:description" content="Browse and filter open job listings by role, location, salary and recency.">
    <meta property="og:url" content="https://ogc16.github.io/simple_job_bank/pages/jobs.html">
    <meta property="og:image" content="https://ogc16.github.io/simple_job_bank/pic/logo.jpg">
    <title>Jobs Board | Job Portal</title>
    <link rel="icon" type="image/jpeg" href="../pic/logo.jpg">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>

<body>
    <div class="container">
        <nav id="app-nav" aria-label="Main navigation"></nav>

        <main class="main">
            <div class="main-top">
                <p>Jobs Board</p>
            </div>
            <div class="main-body">
                <h1>All Jobs</h1>

                <div class="search_bar">
                    <input type="search" id="job-search" placeholder="Search job here..." aria-label="Search jobs">
                    <select id="job-category" aria-label="Filter by category">
                        <option value="">Category</option>
                        <option value="programming">Programming</option>
                        <option value="design">Design</option>
                        <option value="marketing">Marketing</option>
                    </select>
                    <select id="job-location" aria-label="Filter by location">
                        <option value="">Any location</option>
                        <option value="remote">Remote</option>
                        <option value="hybrid">Hybrid</option>
                        <option value="onsite">On-site</option>
                    </select>
                    <select id="job-salary" aria-label="Filter by salary range">
                        <option value="">Any salary</option>
                        <option value="0-90">Under $90k</option>
                        <option value="90-130">$90k &ndash; $130k</option>
                        <option value="130-160">$130k &ndash; $160k</option>
                        <option value="160-400">$160k+</option>
                    </select>
                    <select id="job-filter" class="filter" aria-label="Filter by recency">
                        <option value="">Last posted</option>
                        <option value="3">Last 3 days</option>
                        <option value="5">Last 5 days</option>
                    </select>
                </div>

                <div class="tags_bar">
                    <div class="tag" data-tag="programming">
                        <i class="fas fa-times" aria-hidden="true"></i>
                        <span>Programming</span>
                    </div>
                    <div class="tag" data-tag="design">
                        <i class="fas fa-times" aria-hidden="true"></i>
                        <span>Design</span>
                    </div>
                    <div class="tag" data-tag="marketing">
                        <i class="fas fa-times" aria-hidden="true"></i>
                        <span>Marketing</span>
                    </div>
                </div>

<div class="row">
                    <p>Showing <span id="job-count">18</span> Jobs</p>
                    <a href="job-details.html">See all</a>
                </div>

                <div id="job-list" class="job-list" aria-live="polite" aria-busy="true"></div>

                <div id="no-results" class="empty-state" hidden>
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <p>No jobs match your current filters.</p>
                    <button type="button" class="tag" id="clear-filters">Clear Filters</button>
                </div>

                <div class="row">
                    <p>Browse jobs by category or <span>apply</span> instantly to any listing.</p>
                    <a href="job-details.html">View a sample job</a>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/lib/job-utils.js"></script>
    <script src="../js/jobs.js"></script>
    <script src="../js/job-filters.js"></script>
    <script src="../js/layout.js"></script>
</body>

</html>
