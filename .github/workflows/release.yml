# Attach SLSA provenance (attest-build-provenance) to GitHub releases and
# upload the attested source archive as a release asset. Gives the OpenSSF
# Scorecard "Signed-Releases" check a matching digests to verify.
name: Release provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest and attach the archive to
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    name: Attest build provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create/update the release assets
      id-token: write          # OIDC for provenance attestation + keyless signing
      attestations: write      # store the build provenance attestation
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout release code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false
      - name: Create source archive
        id: archive
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          archive="$RUNNER_TEMP/simple_job_bank-$TAG.tar.gz"
          tar -czf "$archive" -C "$GITHUB_WORKSPACE" --exclude='.git' --exclude='.github' .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.archive.outputs.archive }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the source archive (keyless bundle)
        id: sign
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        shell: bash
        run: |
          cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"
          echo "bundle=$ARCHIVE.sigstore.json" >> "$GITHUB_OUTPUT"
      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload --clobber "${{ steps.resolve.outputs.tag }}" \
            "${{ steps.archive.outputs.archive }}" \
            "${{ steps.sign.outputs.bundle }}"