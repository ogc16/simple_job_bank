# CodeQL — semantic code analysis (SAST) across the JavaScript source.
# Runs on pushes to main, every pull request, and weekly on Sundays.
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 5 * * 0'

permissions:
  contents: read
  security-events: write     # upload SARIF scans to code scanning on push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4