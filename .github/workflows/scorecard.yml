# OpenSSF Scorecard — automated security health checks. Results are uploaded
# as a SARIF scan under the GitHub Security tab and published for the badge:
#   https://api.securityscorecards.dev/projects/github.com/ogc16/simple_job_bank
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 1'     # weekly, Monday 06:27
  push:
    branches:
      - main
  workflow_dispatch:          # allow manual runs to refresh the badge

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write    # upload the SARIF to code scanning
      id-token: write           # sign a provenance attestation
      attestations: read        # detect release provenance (Signed-Releases check)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sarif-results
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif